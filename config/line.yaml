# Ninja line topology.
# All times are SECONDS. Generated as a starting point, then edited by scripts/calibrate.py
# (which overwrites line.arrival.part_delay and line.quality from data/supply_chain.csv).
#
# instrumented: false  -> station emits NO per-unit events; only a sparse manual checklist.
#                         The twin must infer its behaviour from neighbouring timing.
# Buffer i is the INPUT buffer of station i (fed by station i-1).
line:
  n_stations: 40
  takt_time_s: 76.0
  zones:
    body:
    - 1
    - 15
    paint:
    - 16
    - 24
    final_assembly:
    - 25
    - 40
  inspection_station: 40
  arrival:
    interarrival_mean_s: 70.0
    interarrival_cv: 0.08
    part_delay:
      source: defaults
      distribution: lognormal
      probability: 0.03
      median_s: 150.0
      sigma_log: 0.7
  models:
    A: 0.5
    B: 0.3
    C: 0.2
  quality:
    base_defect_rate: 0.005
    source: defaults
    base_defect_codes:
    - SEAL-LEAK
    - FIT-GAP
    - PAINT-ORANGE-PEEL
    - TORQUE-LOW
    - ELEC-OPEN
  stations:
  - id: 1
    name: BODY-01 Underbody Framing
    zone: body
    mean_cycle_s: 65.2
    cycle_sigma_log: 0.094
    buffer_capacity: 5
    instrumented: true
    torque_mean: 50.8
    torque_sd: 1.2
    model_multipliers:
      A: 1.0
      B: 1.0
      C: 1.0
  - id: 2
